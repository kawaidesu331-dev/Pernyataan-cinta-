<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff0f3" />
  <title>Sebuah Pertanyaan Untukmu</title>
  <style>
    :root {
      --pink: #f7cbd5;
      --pink-deep: #e99bad;
      --cream: #fffaf4;
      --ink: #594b55;
      --muted: #9a8791;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
      font-family: "Nunito", "Trebuchet MS", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, #ffe1e8 0 7%, transparent 7.5%),
        radial-gradient(circle at 88% 82%, #fce8d7 0 9%, transparent 9.5%),
        linear-gradient(135deg, #fff7f3, #ffeef2 55%, #f8efff);
    }

    .sparkle {
      position: fixed;
      color: #e6a6b7;
      opacity: .55;
      pointer-events: none;
      user-select: none;
      animation: float 5s ease-in-out infinite;
    }
    .sparkle.one { top: 9%; left: 9%; font-size: 27px; }
    .sparkle.two { top: 17%; right: 11%; font-size: 20px; animation-delay: 1s; }
    .sparkle.three { bottom: 12%; left: 13%; font-size: 24px; animation-delay: 2s; }
    .sparkle.four { bottom: 17%; right: 10%; font-size: 30px; animation-delay: .5s; }

    .card {
      width: min(100%, 430px);
      min-height: 560px;
      padding: 28px 26px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: rgba(255, 255, 255, .88);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 30px;
      box-shadow: 0 22px 65px rgba(135, 91, 112, .16);
      backdrop-filter: blur(12px);
      position: relative;
      isolation: isolate;
    }

    .mascot-wrap {
      width: 190px;
      height: 190px;
      overflow: hidden;
      border-radius: 26px;
      background: #f8efff;
      box-shadow: 0 10px 28px rgba(120, 83, 135, .13);
      margin-bottom: 22px;
      flex: 0 0 auto;
    }
    .mascot {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center 42%;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--pink-deep);
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 330px;
      font-size: clamp(1.35rem, 5vw, 1.8rem);
      line-height: 1.35;
      font-weight: 850;
      letter-spacing: -.035em;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: .94rem;
      line-height: 1.6;
    }

    .buttons {
      width: 100%;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    button {
      min-width: 124px;
      border: 0;
      border-radius: 999px;
      padding: 13px 23px;
      font: inherit;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
      touch-action: manipulation;
    }
    button:hover { transform: translateY(-3px); }
    button:active { transform: scale(.97); }

    .yes {
      color: #fff;
      background: linear-gradient(135deg, #ee9eaf, #e783a0);
      box-shadow: 0 8px 18px rgba(231, 131, 160, .28);
    }
    .yes:hover { box-shadow: 0 11px 24px rgba(231, 131, 160, .38); }

    .no {
      color: #806f79;
      background: #f4edf0;
    }
    .no:hover { background: #eee3e9; }

    .note {
      margin-top: 24px;
      color: #b5a5ad;
      font-size: .78rem;
    }

    .card-content {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: appear .48s cubic-bezier(.2,.8,.2,1) both;
    }

    .card.leaving .card-content {
      animation: disappear .18s ease forwards;
    }

    .final-heart {
      font-size: 2.2rem;
      margin-top: 20px;
      animation: heartbeat 1.5s ease-in-out infinite;
    }

    #runaway {
      position: relative;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(13px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes disappear {
      to { opacity: 0; transform: translateY(-8px) scale(.98); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-8deg); }
      50% { transform: translateY(-13px) rotate(8deg); }
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.15); }
      30% { transform: scale(1); }
      45% { transform: scale(1.1); }
    }

    @media (max-width: 480px) {
      .card { min-height: 0; padding: 25px 20px 27px; border-radius: 25px; }
      .mascot-wrap { width: 165px; height: 165px; margin-bottom: 20px; }
      button { min-width: 112px; }
      .sparkle.one { left: 4%; }
      .sparkle.two { right: 4%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

    function showGoodbye(message) {
      changeScreen(`
        ${mascotMarkup()}
        <p class="eyebrow">Terima kasih sudah menjawab</p>
        <h1>${message}</h1>
        <div class="final-heart" aria-hidden="true">♡</div>
      `);
    }

    function bindCurrentButtons() {
      const yes1 = document.getElementById("yes1");
      const no1 = document.getElementById("no1");
      const really = document.getElementById("really");
      const notReally = document.getElementById("notReally");
      const yesFinal = document.getElementById("yesFinal");
      const joke = document.getElementById("runaway");

      if (yes1) yes1.addEventListener("click", () => {
        changeScreen(`
          ${mascotMarkup()}
          <p class="eyebrow">Tunggu, aku mau memastikan...</p>
          <h1>Beneran mau sama aku?</h1>
          <p class="subtitle">Jangan bikin aku salah paham, ya.</p>
          <div class="buttons">
            <button class="yes" id="really">Beneran?</button>
            <button class="no" id="notReally">Enggak</button>
          </div>
        `);
      });

      if (no1) no1.addEventListener("click", () => {
        showGoodbye("owh, yaudah maap ya udah ganggu");
      });

      if (really) really.addEventListener("click", () => {
        changeScreen(`
          ${mascotMarkup()}
          <p class="eyebrow">Satu pertanyaan lagi...</p>
          <h1>Jadi sekarang kita pacaran?</h1>
          <p class="subtitle">Pilih yang jujur, ya. Aku siap menerima jawabannya.</p>
          <div class="buttons">
            <button class="yes" id="yesFinal">Iya</button>
            <button class="no" id="runaway">Canda</button>
          </div>
        `);
      });

      if (notReally) notReally.addEventListener("click", () => {
        showGoodbye("maap ya udah ganggu hehe😅");
      });

      if (yesFinal) yesFinal.addEventListener("click", () => {
        changeScreen(`
          ${mascotMarkup()}
          <p class="eyebrow">YEAY! ♡</p>
          <h1>Horeee, mulai hari ini kita punya cerita baru!</h1>
          <p class="subtitle">Makasih sudah menerima aku. Semoga kita bisa saling menjaga dan menghargai.</p>
          <div class="final-heart" aria-hidden="true">♥</div>
        `);
      });

      if (joke) {
        joke.addEventListener("pointerenter", moveJokeButton);
        joke.addEventListener("click", () => showGoodbye("maap ya udah ganggu hehe😅"));
        joke.addEventListener("touchstart", (event) => {
          event.preventDefault();
          moveJokeButton();
        }, { passive: false });
      }
    }

    function moveJokeButton() {
      const button = document.getElementById("runaway");
      if (!button) return;
      const cardRect = card.getBoundingClientRect();
      const buttonRect = button.getBoundingClientRect();
      const maxX = Math.max(0, cardRect.width - buttonRect.width - 36);
      const maxY = Math.max(0, cardRect.height - buttonRect.height - 36);
      const x = Math.random() * maxX - maxX / 2;
      const y = Math.random() * maxY - maxY / 2;
      button.style.position = "relative";
      button.style.transform = `translate(${x}px, ${y}px)`;
    }

    bindCurrentButtons();
  </script>
